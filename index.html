<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青花瓷宠物盘 · Qinghua Pet Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4ede0;
    --paper-deep: #ebe0cc;
    --ink: #1a1a1a;
    --qinghua: #1d3f7a;
    --qinghua-deep: #0f2452;
    --qinghua-light: #6b8bbf;
    --seal: #a8332a;
    --gold: #b08947;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Serif SC', serif;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(176, 137, 71, 0.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(29, 63, 122, 0.04) 0%, transparent 40%);
  }
  .frame { max-width: 1200px; margin: 0 auto; padding: 60px 40px 80px; }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid rgba(29, 63, 122, 0.2);
    padding-bottom: 24px; margin-bottom: 56px;
  }
  .brand { display: flex; align-items: baseline; gap: 18px; }
  .brand-cn {
    font-weight: 900; font-size: 36px; letter-spacing: 0.08em;
    color: var(--qinghua-deep);
  }
  .brand-en {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 18px; color: var(--qinghua); opacity: 0.7;
  }
  .meta {
    font-family: 'Cormorant Garamond', serif; font-size: 13px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink); opacity: 0.5;
  }

  .stage {
    display: grid; grid-template-columns: 1fr 380px;
    gap: 56px; align-items: start;
  }
  @media (max-width: 880px) {
    .stage { grid-template-columns: 1fr; }
    .frame { padding: 36px 20px 60px; }
    .brand-cn { font-size: 28px; }
  }

  .plate-stage {
    aspect-ratio: 1; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  #plateCanvas {
    width: 100%; height: auto; max-width: 680px;
    filter: drop-shadow(0 30px 50px rgba(29, 63, 122, 0.18))
            drop-shadow(0 8px 16px rgba(0, 0, 0, 0.08));
    transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
  }
  #plateCanvas:hover { transform: rotate(-1deg) scale(1.01); }

  .empty-hint {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none; text-align: center;
    color: var(--qinghua); opacity: 0.55;
  }
  .empty-hint .cn { font-size: 22px; letter-spacing: 0.1em; margin-bottom: 6px; }
  .empty-hint .en {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 14px; letter-spacing: 0.15em;
  }

  .panel { display: flex; flex-direction: column; gap: 36px; padding-top: 8px; }
  .section-label {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 13px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--qinghua); margin-bottom: 14px; padding-bottom: 8px;
    border-bottom: 1px dashed rgba(29, 63, 122, 0.3);
  }
  .section-label::before { content: "❋ "; color: var(--seal); }

  .upload-box {
    display: block;
    border: 1.5px dashed var(--qinghua);
    background: rgba(255, 255, 255, 0.4);
    border-radius: 4px; padding: 28px 20px;
    text-align: center; cursor: pointer;
    transition: all 0.3s ease;
  }
  .upload-box:hover, .upload-box.drag {
    background: rgba(29, 63, 122, 0.06);
    border-color: var(--qinghua-deep);
  }
  .upload-box .title {
    font-size: 16px; color: var(--qinghua-deep);
    font-weight: 600; margin-bottom: 6px;
  }
  .upload-box .sub {
    font-family: 'Cormorant Garamond', serif; font-size: 13px;
    color: var(--ink); opacity: 0.55; font-style: italic;
  }
  #fileInput { display: none; }

  .control { margin-bottom: 20px; }
  .control .row {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 8px;
  }
  .control .name { font-size: 14px; color: var(--qinghua-deep); }
  .control .val {
    font-family: 'Cormorant Garamond', serif; font-size: 13px;
    color: var(--qinghua); font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    -webkit-appearance: none; width: 100%; height: 2px;
    background: rgba(29, 63, 122, 0.25); outline: none; border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: var(--qinghua); border-radius: 50%; cursor: pointer;
    border: 2px solid var(--paper);
    box-shadow: 0 0 0 1px var(--qinghua);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    background: var(--qinghua); border-radius: 50%; cursor: pointer;
    border: 2px solid var(--paper);
    box-shadow: 0 0 0 1px var(--qinghua);
  }

  .patterns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pattern-chip {
    aspect-ratio: 1;
    border: 1px solid rgba(29, 63, 122, 0.3);
    background: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; transition: all 0.2s; padding: 4px;
  }
  .pattern-chip:hover { border-color: var(--qinghua); }
  .pattern-chip.active {
    border: 2px solid var(--qinghua-deep);
    box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--qinghua);
  }
  .pattern-chip canvas { width: 100%; height: 100%; }

  .actions { display: flex; gap: 12px; margin-top: 8px; }
  .btn {
    flex: 1; padding: 14px 16px; border: none; cursor: pointer;
    font-family: inherit; font-size: 14px; letter-spacing: 0.08em;
    transition: all 0.2s; border-radius: 2px;
  }
  .btn-primary { background: var(--qinghua-deep); color: var(--paper); }
  .btn-primary:hover { background: var(--qinghua); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; color: var(--qinghua-deep);
    border: 1px solid var(--qinghua);
  }
  .btn-ghost:hover { background: rgba(29, 63, 122, 0.06); }

  .seal {
    position: absolute; bottom: 8%; right: 12%;
    width: 64px; height: 64px;
    background: var(--seal); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: var(--paper); font-weight: 900; font-size: 18px;
    letter-spacing: 0.05em; line-height: 1.1; text-align: center;
    transform: rotate(-4deg);
    box-shadow: 0 2px 8px rgba(168, 51, 42, 0.3);
    opacity: 0; transition: opacity 0.4s;
    font-family: 'Noto Serif SC', serif;
  }
  .seal.visible { opacity: 0.9; }
</style>
</head>
<body>

<div class="frame">
  <header>
    <div class="brand">
      <div class="brand-cn">青花瓷宠物盘</div>
      <div class="brand-en">— Porcelain Portraits —</div>
    </div>
    <div class="meta">est. 二〇二六</div>
  </header>

  <div class="stage">
    <div class="plate-stage">
      <canvas id="plateCanvas" width="1200" height="1200"></canvas>
      <div class="empty-hint" id="emptyHint">
        <div class="cn">上 传 爱 宠 照 片</div>
        <div class="en">Begin your porcelain portrait</div>
      </div>
      <div class="seal" id="seal">青花<br>御制</div>
    </div>

    <aside class="panel">
      <div>
        <div class="section-label">上传 · Upload</div>
        <label class="upload-box" id="uploadBox" for="fileInput">
          <input type="file" id="fileInput" accept="image/*">
          <div class="title">选择宠物照片</div>
          <div class="sub">Click or drop an image · JPG / PNG</div>
        </label>
      </div>

      <div>
        <div class="section-label">纹样 · Pattern</div>
        <div class="patterns" id="patterns"></div>
      </div>

      <div>
        <div class="section-label">调整 · Adjust</div>
        <div class="control">
          <div class="row"><span class="name">简化程度 Simplify</span><span class="val" id="simplifyVal">2.5</span></div>
          <input type="range" id="simplify" min="0" max="6" step="0.1" value="2.5">
        </div>
        <div class="control">
          <div class="row"><span class="name">线条强度 Line</span><span class="val" id="lineVal">1.00</span></div>
          <input type="range" id="line" min="0" max="2" step="0.05" value="1.0">
        </div>
        <div class="control">
          <div class="row"><span class="name">画面缩放 Zoom</span><span class="val" id="zoomVal">1.00</span></div>
          <input type="range" id="zoom" min="0.6" max="1.8" step="0.02" value="1.00">
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="resetBtn">重置</button>
        <button class="btn btn-primary" id="downloadBtn" disabled>下载图片 ↓</button>
      </div>
    </aside>
  </div>
</div>

<script>
const canvas = document.getElementById('plateCanvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const uploadBox = document.getElementById('uploadBox');
const emptyHint = document.getElementById('emptyHint');
const seal = document.getElementById('seal');
const simplifySlider = document.getElementById('simplify');
const lineSlider = document.getElementById('line');
const zoomSlider = document.getElementById('zoom');
const simplifyVal = document.getElementById('simplifyVal');
const lineVal = document.getElementById('lineVal');
const zoomVal = document.getElementById('zoomVal');
const downloadBtn = document.getElementById('downloadBtn');
const resetBtn = document.getElementById('resetBtn');
const patternsEl = document.getElementById('patterns');

const W = canvas.width, H = canvas.height;
const CX = W / 2, CY = H / 2;
const PLATE_R = 540;
const INNER_R = 380;
const RIM_OUTER = 540;
const RIM_INNER = 410;

let sourceImage = null;
let currentPattern = 'lotus';

const QINGHUA = '#1d3f7a';
const QINGHUA_DEEP = '#0f2452';
const PAPER_WHITE = '#f8f3e6';

// Patterns drawn as repeating tiles around the rim
const PATTERNS = {
  lotus: {
    name: '缠枝莲', tile: 24,
    draw: (c, w, h) => {
      c.strokeStyle = QINGHUA;
      c.lineWidth = h * 0.05;
      c.beginPath();
      c.moveTo(0, h * 0.5);
      c.bezierCurveTo(w * 0.25, h * 0.1, w * 0.75, h * 0.9, w, h * 0.5);
      c.stroke();
      c.fillStyle = QINGHUA;
      c.beginPath();
      c.ellipse(w * 0.5, h * 0.5, w * 0.18, h * 0.32, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = PAPER_WHITE;
      c.beginPath();
      c.ellipse(w * 0.5, h * 0.5, w * 0.08, h * 0.2, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = QINGHUA_DEEP;
      c.beginPath();
      c.arc(w * 0.15, h * 0.3, h * 0.05, 0, Math.PI * 2);
      c.arc(w * 0.85, h * 0.7, h * 0.05, 0, Math.PI * 2);
      c.fill();
    }
  },
  cloud: {
    name: '云纹', tile: 18,
    draw: (c, w, h) => {
      c.strokeStyle = QINGHUA;
      c.lineWidth = h * 0.07;
      c.lineCap = 'round';
      const cy = h * 0.5;
      c.beginPath();
      c.moveTo(0, cy);
      c.bezierCurveTo(w * 0.2, cy - h * 0.35, w * 0.8, cy - h * 0.35, w, cy);
      c.stroke();
      c.beginPath();
      c.arc(w * 0.5, cy + h * 0.05, h * 0.18, Math.PI * 0.2, Math.PI * 1.8, false);
      c.stroke();
      c.beginPath();
      c.arc(w * 0.5, cy + h * 0.05, h * 0.08, Math.PI * 0.2, Math.PI * 1.6, false);
      c.stroke();
    }
  },
  wave: {
    name: '海水纹', tile: 30,
    draw: (c, w, h) => {
      c.strokeStyle = QINGHUA;
      c.lineWidth = h * 0.04;
      c.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        c.beginPath();
        const offset = i * h * 0.22;
        for (let x = 0; x <= w; x += 2) {
          const y = h * 0.3 + offset + Math.sin((x / w) * Math.PI * 2) * h * 0.08;
          if (x === 0) c.moveTo(x, y); else c.lineTo(x, y);
        }
        c.stroke();
      }
    }
  },
  geo: {
    name: '回纹', tile: 26,
    draw: (c, w, h) => {
      c.strokeStyle = QINGHUA;
      c.lineWidth = h * 0.06;
      c.lineJoin = 'miter';
      const m = h * 0.12;
      c.beginPath();
      c.moveTo(m, m);
      c.lineTo(w - m, m);
      c.lineTo(w - m, h - m);
      c.lineTo(m * 2.5, h - m);
      c.lineTo(m * 2.5, m * 2.8);
      c.lineTo(w - m * 2.5, m * 2.8);
      c.stroke();
    }
  },
  flower: {
    name: '折枝花', tile: 22,
    draw: (c, w, h) => {
      c.fillStyle = QINGHUA;
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
        const px = w * 0.5 + Math.cos(angle) * w * 0.22;
        const py = h * 0.5 + Math.sin(angle) * h * 0.22;
        c.beginPath();
        c.ellipse(px, py, w * 0.14, h * 0.18, angle, 0, Math.PI * 2);
        c.fill();
      }
      c.fillStyle = QINGHUA_DEEP;
      c.beginPath();
      c.arc(w * 0.5, h * 0.5, h * 0.12, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = PAPER_WHITE;
      c.beginPath();
      c.arc(w * 0.5, h * 0.5, h * 0.05, 0, Math.PI * 2);
      c.fill();
    }
  },
  bamboo: {
    name: '竹节纹', tile: 28,
    draw: (c, w, h) => {
      c.fillStyle = QINGHUA;
      c.fillRect(w * 0.4, h * 0.05, w * 0.2, h * 0.9);
      c.fillStyle = QINGHUA_DEEP;
      c.fillRect(w * 0.35, h * 0.3, w * 0.3, h * 0.05);
      c.fillRect(w * 0.35, h * 0.65, w * 0.3, h * 0.05);
      c.fillStyle = QINGHUA;
      c.beginPath();
      c.ellipse(w * 0.15, h * 0.4, w * 0.18, h * 0.05, -0.4, 0, Math.PI * 2);
      c.fill();
      c.beginPath();
      c.ellipse(w * 0.85, h * 0.7, w * 0.18, h * 0.05, 0.4, 0, Math.PI * 2);
      c.fill();
    }
  }
};

function buildPatternSelector() {
  Object.entries(PATTERNS).forEach(([key, p]) => {
    const chip = document.createElement('div');
    chip.className = 'pattern-chip' + (key === currentPattern ? ' active' : '');
    chip.title = p.name;
    chip.dataset.key = key;
    const mini = document.createElement('canvas');
    mini.width = 80; mini.height = 80;
    const mctx = mini.getContext('2d');
    mctx.fillStyle = PAPER_WHITE;
    mctx.beginPath(); mctx.arc(40, 40, 38, 0, Math.PI * 2); mctx.fill();
    mctx.strokeStyle = 'rgba(29,63,122,0.2)';
    mctx.lineWidth = 1; mctx.stroke();
    mctx.save();
    mctx.translate(40, 40);
    for (let i = 0; i < 8; i++) {
      mctx.save();
      mctx.rotate((i / 8) * Math.PI * 2);
      mctx.translate(0, -28);
      mctx.scale(0.45, 0.45);
      mctx.translate(-12, -12);
      p.draw(mctx, 24, 24);
      mctx.restore();
    }
    mctx.restore();
    chip.appendChild(mini);
    chip.addEventListener('click', () => {
      currentPattern = key;
      document.querySelectorAll('.pattern-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      render();
    });
    patternsEl.appendChild(chip);
  });
}

// Image → blue-and-white porcelain pixel transform
function processToQinghua(img, contrast, hueDepth) {
  const off = document.createElement('canvas');
  const size = INNER_R * 2;
  off.width = size; off.height = size;
  const offCtx = off.getContext('2d');

  const aspect = img.width / img.height;
  let dw, dh;
  if (aspect > 1) { dh = size; dw = size * aspect; }
  else { dw = size; dh = size / aspect; }
  const zoom = parseFloat(zoomSlider.value);
  dw *= zoom; dh *= zoom;
  offCtx.drawImage(img, (size - dw) / 2, (size - dh) / 2, dw, dh);

  const imgData = offCtx.getImageData(0, 0, size, size);
  const d = imgData.data;
  const deepR = 15, deepG = 35, deepB = 90;
  const lightR = 248, lightG = 243, lightB = 230;
  for (let i = 0; i < d.length; i += 4) {
    let lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    lum = ((lum - 128) * contrast) + 128;
    lum = Math.max(0, Math.min(255, lum));
    let t = 1 - lum / 255;
    t = Math.pow(t, 1.6) * (hueDepth / 60);
    t = Math.min(1, t);
    d[i]     = lightR * (1 - t) + deepR * t;
    d[i + 1] = lightG * (1 - t) + deepG * t;
    d[i + 2] = lightB * (1 - t) + deepB * t;
  }
  offCtx.putImageData(imgData, 0, 0);
  return off;
}

function render() {
  ctx.clearRect(0, 0, W, H);

  // outer soft shadow
  const shadowGrad = ctx.createRadialGradient(CX, CY, PLATE_R * 0.95, CX, CY, PLATE_R * 1.08);
  shadowGrad.addColorStop(0, 'rgba(29, 63, 122, 0.15)');
  shadowGrad.addColorStop(1, 'rgba(29, 63, 122, 0)');
  ctx.fillStyle = shadowGrad;
  ctx.beginPath();
  ctx.arc(CX, CY, PLATE_R * 1.08, 0, Math.PI * 2);
  ctx.fill();

  // plate body
  const plateGrad = ctx.createRadialGradient(CX - 80, CY - 80, 100, CX, CY, PLATE_R);
  plateGrad.addColorStop(0, '#fefcf5');
  plateGrad.addColorStop(0.7, '#f4ecd9');
  plateGrad.addColorStop(1, '#e8dec5');
  ctx.fillStyle = plateGrad;
  ctx.beginPath();
  ctx.arc(CX, CY, PLATE_R, 0, Math.PI * 2);
  ctx.fill();

  // outer rings
  ctx.strokeStyle = QINGHUA;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(CX, CY, PLATE_R - 6, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(CX, CY, PLATE_R - 18, 0, Math.PI * 2); ctx.stroke();

  // rim pattern
  drawRimPattern();

  // inner rings
  ctx.strokeStyle = QINGHUA;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(CX, CY, RIM_INNER, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, RIM_INNER - 10, 0, Math.PI * 2); ctx.stroke();

  // inner well bg
  ctx.fillStyle = '#f6efde';
  ctx.beginPath(); ctx.arc(CX, CY, INNER_R, 0, Math.PI * 2); ctx.fill();

  // processed pet image
  if (sourceImage) {
    const contrast = parseFloat(contrastSlider.value);
    const hueDepth = parseFloat(hueSlider.value);
    const processed = processToQinghua(sourceImage, contrast, hueDepth);
    ctx.save();
    ctx.beginPath();
    ctx.arc(CX, CY, INNER_R - 4, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(processed, CX - INNER_R, CY - INNER_R);
    ctx.restore();
    const innerShadow = ctx.createRadialGradient(CX, CY, INNER_R * 0.85, CX, CY, INNER_R);
    innerShadow.addColorStop(0, 'rgba(0,0,0,0)');
    innerShadow.addColorStop(1, 'rgba(15, 36, 82, 0.12)');
    ctx.fillStyle = innerShadow;
    ctx.beginPath(); ctx.arc(CX, CY, INNER_R, 0, Math.PI * 2); ctx.fill();
  }

  // top-left highlight
  const highlight = ctx.createRadialGradient(
    CX - PLATE_R * 0.5, CY - PLATE_R * 0.5, 0,
    CX - PLATE_R * 0.5, CY - PLATE_R * 0.5, PLATE_R * 0.6
  );
  highlight.addColorStop(0, 'rgba(255, 255, 255, 0.18)');
  highlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, PLATE_R, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = highlight;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawRimPattern() {
  const pattern = PATTERNS[currentPattern];
  const tiles = pattern.tile;
  const ringR = (RIM_OUTER - 18 + RIM_INNER) / 2;
  const tileH = RIM_OUTER - 18 - RIM_INNER - 6;
  const arcLen = (2 * Math.PI * ringR) / tiles;
  for (let i = 0; i < tiles; i++) {
    const angle = (i / tiles) * Math.PI * 2;
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(angle + Math.PI / 2);
    ctx.translate(-arcLen / 2, -RIM_OUTER + 18);
    pattern.draw(ctx, arcLen, tileH);
    ctx.restore();
  }
}

function loadImageFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      sourceImage = img;
      emptyHint.style.display = 'none';
      seal.classList.add('visible');
      downloadBtn.disabled = false;
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

fileInput.addEventListener('change', e => loadImageFile(e.target.files[0]));
uploadBox.addEventListener('dragover', e => { e.preventDefault(); uploadBox.classList.add('drag'); });
uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('drag'));
uploadBox.addEventListener('drop', e => {
  e.preventDefault();
  uploadBox.classList.remove('drag');
  loadImageFile(e.dataTransfer.files[0]);
});

function bindSlider(slider, valEl, fmt = v => v) {
  slider.addEventListener('input', () => {
    valEl.textContent = fmt(slider.value);
    if (sourceImage) render();
  });
}
bindSlider(contrastSlider, contrastVal, v => parseFloat(v).toFixed(2));
bindSlider(hueSlider, hueVal);
bindSlider(zoomSlider, zoomVal, v => parseFloat(v).toFixed(2));

resetBtn.addEventListener('click', () => {
  contrastSlider.value = 1.4; contrastVal.textContent = '1.40';
  hueSlider.value = 55; hueVal.textContent = '55';
  zoomSlider.value = 1.0; zoomVal.textContent = '1.00';
  if (sourceImage) render();
});

downloadBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'qinghua-pet-plate.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

buildPatternSelector();
render();
</script>
</body>
</html>
